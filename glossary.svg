<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1328" viewBox="0 0 900 1328">
<defs>
<linearGradient id="shellEdge" x1="0" y1="0" x2="1" y2="0.9">
<stop offset="0" stop-color="#e3b341" stop-opacity="0.85"/>
<stop offset="0.3" stop-color="#e3b341" stop-opacity="0.12"/>
<stop offset="0.65" stop-color="#30363d" stop-opacity="1"/>
</linearGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="1327" rx="12" fill="#0d1117" stroke="url(#shellEdge)"/>
<text x="24" y="30" font-size="18" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Glossary</text>
<text x="24" y="48" font-size="12.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the homegrown stats on this page, and how they're computed</text>
<g transform="translate(0,56)"><text x="24" y="19.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wRP</text><text x="120" y="19.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">weighted Reps Practiced</text>
<text x="120" y="37.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Σ commits √min(400, lines credited to the skill) · 4-week weights 1 / .6 / .36 / .22</text>
<text x="120" y="55.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Reads each week's actual diffs, not commit messages, across every repo I own: my commits, the dev agents' (Claude,</text>
<text x="120" y="71.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Cursor, Copilot) and code-fixing CI bots'; pure automations — snapshot pushes, dependency bots — don't count. A file that</text>
<text x="120" y="87.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">is the skill (Dockerfile, workflow YAML, test file) credits all its changed lines; a changed line that uses it (import</text>
<text x="120" y="103.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">torch, async def, CREATE TABLE) credits 4 lines of context. Deletions count half; lockfiles, vendored and generated files</text>
<text x="120" y="119.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">are ignored. The square root rewards steady, focused reps over one giant dump. Bubbles show the percentile of that 4-week</text>
<text x="120" y="135.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wRP among every skill's 4-week wRP over the last 26 weeks, a league made of my own skill-weeks: 50 is a median</text>
<text x="120" y="151.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">skill-week, 99 is among my most-practiced.</text>
<line x1="24" y1="166.0" x2="876" y2="166.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="187.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">gWAR</text><text x="120" y="187.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Git Wins Above Replacement</text>
<text x="120" y="205.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ln(1+commits 90d) + 1.25·ln(1+stars) + 0.75·ln(1+forks) + freshness − replacement</text>
<text x="120" y="223.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Runs created by a repo: recent activity and adoption, log-damped so one viral repo or one sprint can't own the scale,</text>
<text x="120" y="239.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">plus up to 1 for a push in the last 90 days. Replacement level is the 20th-percentile repo in my public index, so a</text>
<text x="120" y="255.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">forgettable repo sits near 0 and can dip negative. Not Baseball-Reference's bWAR.</text>
<line x1="24" y1="270.0" x2="876" y2="270.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="291.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Lang+</text><text x="120" y="291.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">language usage, 100-neutral split</text>
<text x="120" y="309.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 + (100 × (30d share ÷ 12m share) − 100) × volume-weight</text>
<text x="120" y="327.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Like OPS+: 100 is my normal usage of a language, 130 means 30% more of my commits touched it this month than over the</text>
<text x="120" y="343.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">year. Languages come from the extensions of the files each commit changed, across every repo and branch, so a commit</text>
<text x="120" y="359.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">counts once for each language it touched. Empirical Bayes shrinkage regresses small samples toward 100 based on commit</text>
<text x="120" y="375.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">volume (prior = 25 commits), so a language needs real reps before it moves far from 100. Displayed in both Top Languages</text>
<text x="120" y="391.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">and the 30-day Language Activity lanes.</text>
<line x1="24" y1="406.0" x2="876" y2="406.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="427.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wDC</text><text x="120" y="427.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">weighted Deployments Created</text>
<text x="120" y="445.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Σ weeks-of-last-4 (deployments that week) · weights 1 / .6 / .36 / .22</text>
<text x="120" y="463.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Every deployment I created in the last four weeks: Cloudflare Pages deploys plus Workers last-deployed timestamps.</text>
<text x="120" y="479.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Recency-weighted, so shipping this week counts about five times as much as shipping four weeks ago. On the Season Stat</text>
<text x="120" y="495.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Line card.</text>
<line x1="24" y1="510.0" x2="876" y2="510.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="531.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">aERA</text><text x="120" y="531.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">adjusted Actions ERA</text>
<text x="120" y="549.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">9 × (failed runs, regressed) ÷ total runs · lower is better</text>
<text x="120" y="567.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Borrowed from pitching: earned runs per 9 innings, here failed GitHub Actions runs per 9 runs across my public repos over</text>
<text x="120" y="583.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the last 28 days. League average is about 4.50; green means the pipelines mostly stay up. Small samples are regressed</text>
<text x="120" y="599.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">toward 4.50 with 9 phantom league-average runs. The lowercase-a prefix keeps it clear of the pitching ERA on the Dugout</text>
<text x="120" y="615.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Dispatch card.</text>
<line x1="24" y1="630.0" x2="876" y2="630.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="651.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Pace+</text><text x="120" y="651.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">commit pace, 100-neutral split</text>
<text x="120" y="669.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 × (recent daily rate, regressed) ÷ baseline daily rate</text>
<text x="120" y="687.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Recent pace against the usual pace, regressed with 7 days at the baseline rate. Activity: the last 30 days of</text>
<text x="120" y="703.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">contributions vs the year. Repo cards and the Immaculate Grid: a repo's last 30 days of commits vs its own 90-day rate.</text>
<line x1="24" y1="718.0" x2="876" y2="718.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="739.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">FIX−</text><text x="120" y="739.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">corrective load, 100-neutral</text>
<text x="120" y="757.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 × 28-day fix share (regressed) ÷ season fix share</text>
<text x="120" y="775.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Share of commits fixing rather than building: subjects matching fix, hotfix, revert, or bugfix across every owned repo</text>
<text x="120" y="791.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">and branch. 100 is my usual load, 70 means a third fewer fixes than usual. On the Season Stat Line card.</text>
<line x1="24" y1="806.0" x2="876" y2="806.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="827.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SHIP+</text><text x="120" y="827.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">share of active repos shipping</text>
<text x="120" y="845.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">repos with a release in 90 days ÷ active repos</text>
<text x="120" y="863.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">What share of repos I actually touched shipped a release this quarter. Higher is better. On the Season Stat Line card.</text>
<line x1="24" y1="878.0" x2="876" y2="878.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="899.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">dOUT−</text><text x="120" y="899.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">sidelined repos</text>
<text x="120" y="917.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">repos whose latest default-branch check failed</text>
<text x="120" y="935.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">The injured list: a plain count, lower is better. On the Season Stat Line card.</text>
<line x1="24" y1="950.0" x2="876" y2="950.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="971.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wMRG+</text><text x="120" y="971.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">recency-weighted merge rate</text>
<text x="120" y="989.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">merged ÷ decided PRs, weeks weighted 1/.6/.36/.22</text>
<text x="120" y="1007.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Share of closed pull requests that merged over 90 days, this week's outcomes counting most. Higher is better. On the</text>
<text x="120" y="1023.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Season Stat Line card.</text>
<line x1="24" y1="1038.0" x2="876" y2="1038.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="1059.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">+/−</text><text x="120" y="1059.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">polarity suffixes</text>
<text x="120" y="1077.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 = my normal baseline</text>
<text x="120" y="1095.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">A trailing + means higher is more-or-better (Lang+, Pace+, SHIP+); a trailing − means lower is better (FIX−, RUST−). On a</text>
<text x="120" y="1111.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">100-neutral split, 100 is always my normal rate and distance from 100 is the story, in whichever direction the suffix</text>
<text x="120" y="1127.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">points.</text>
<line x1="24" y1="1142.0" x2="876" y2="1142.0" stroke="#30363d" stroke-width="1"/>
<text x="24" y="1163.0" font-size="15" font-weight="800" fill="#e3b341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a w g d n</text><text x="120" y="1163.0" font-size="12.5" font-weight="700" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">method and scope prefixes</text>
<text x="120" y="1181.0" font-size="11" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">a regressed · w recency-weighted · g/d/n scoped</text>
<text x="120" y="1199.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a (adjusted): small samples are regressed toward the baseline with phantom league-average events, so a quiet stretch</text>
<text x="120" y="1215.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">can't fake elite (aERA, aTURN−). w (weighted): weekly values decay 1, .6, .36, .22 newest-first, so this week counts</text>
<text x="120" y="1231.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">about five times as much as four weeks ago (wDC, wMRG+, wROT+). g/d/n scope the count: git-native totals, the default</text>
<text x="120" y="1247.0" font-size="11.5" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">branch, or nocturnal hours outside 9–5 PT.</text></g>
</svg>