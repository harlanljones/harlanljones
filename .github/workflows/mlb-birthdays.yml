name: Daily MLB Birthday Almanac
on:
  schedule:
    - cron: "0 5 * * *" # Runs daily at 05:00 UTC (midnight EST)
  workflow_dispatch:
    inputs:
      month:
        description: "Month (1-12, optional)"
        required: false
        type: number
      day:
        description: "Day (1-31, optional)"
        required: false
        type: number

jobs:
  update-almanac:
    name: Update MLB Birthday Dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Daily Dugout Dispatch
        run: |
          git pull --rebase origin main
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="$ARGS --month ${{ github.event.inputs.month }}"
          fi
          if [ -n "${{ github.event.inputs.day }}" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day }}"
          fi
          python3 scripts/mlb_birthdays.py $ARGS

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(almanac): update daily MLB birthday dispatch [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
