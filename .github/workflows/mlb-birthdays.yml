name: Daily MLB Birthday Almanac
on:
  schedule:
    - cron: "0 5 * * *" # Runs daily at 05:00 UTC (midnight EST)
  workflow_dispatch:
    inputs:
      month:
        description: "Month (1-12, optional)"
        required: false
        type: number
      day:
        description: "Day (1-31, optional)"
        required: false
        type: number

concurrency:
  group: mlb-birthdays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-almanac:
    name: Update MLB Birthday Dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync with remote and generate dispatch
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="$ARGS --month ${{ github.event.inputs.month }}"
          fi
          if [ -n "${{ github.event.inputs.day }}" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day }}"
          fi
          python3 scripts/mlb_birthdays.py $ARGS

      - name: Commit and push changes
        run: |
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(almanac): update daily MLB birthday dispatch [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt ${attempt}"
                exit 0
              fi
            else
              echo "Rebase failed on attempt ${attempt}"
              git rebase --abort || true
            fi
            echo "Attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
