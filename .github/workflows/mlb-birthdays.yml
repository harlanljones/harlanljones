name: Daily MLB Birthday Almanac
on:
  schedule:
    - cron: "0 5 * * *" # Runs daily at 05:00 UTC (midnight EST)
  workflow_dispatch:
    inputs:
      month:
        description: "Month (1-12, optional)"
        required: false
        type: number
      day:
        description: "Day (1-31, optional)"
        required: false
        type: number

jobs:
  update-almanac:
    name: Update MLB Birthday Dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Daily Dugout Dispatch
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="$ARGS --month ${{ github.event.inputs.month }}"
          fi
          if [ -n "${{ github.event.inputs.day }}" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day }}"
          fi
          python3 scripts/mlb_birthdays.py $ARGS

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(almanac): update daily MLB birthday dispatch [skip ci]"
            git push
          fi
