name: Repo Cards

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly, Sunday 06:00 UTC (Sat 11 PM Pacific)
  workflow_dispatch:

concurrency:
  group: repo-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-repo-cards:
    name: Render Repo Leaderboard, Spotlight & Grid
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generated SVGs are committed to a dedicated branch so they never land
      # on main. The README references them via raw.githubusercontent.com URLs
      # on this branch.
      - name: Create output branch if missing
        run: |
          if ! git ls-remote --exit-code --heads origin profile-cards > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan profile-cards
            git rm -rf --cached . > /dev/null
            git commit --allow-empty -m "Initialize profile-cards output branch"
            git push origin profile-cards
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/render_repo_cards.py \
            --username "${{ github.repository_owner }}" \
            --out-dir "${RUNNER_TEMP}"

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: profile-cards

      - name: Publish rendered cards to profile-cards branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in repo-leaderboard repo-spotlight dev-grid; do
            cp "${RUNNER_TEMP}/${f}.svg" "${RUNNER_TEMP}/${f}-light.svg" .
            git add "${f}.svg" "${f}-light.svg"
          done
          if git diff --staged --quiet; then
            echo "No card changes to publish"
            exit 0
          fi
          git commit -m "chore(repo-cards): update leaderboard, spotlight, and grid"
          for attempt in 1 2 3 4 5; do
            git fetch origin profile-cards
            if git rebase origin/profile-cards; then
              if git push origin HEAD:profile-cards; then
                echo "Push succeeded on attempt ${attempt}"
                exit 0
              fi
            else
              echo "Rebase failed on attempt ${attempt}"
              git rebase --abort || true
            fi
            echo "Attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
