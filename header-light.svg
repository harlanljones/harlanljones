<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<defs>
<linearGradient id="hbEdge" x1="0" y1="0" x2="1" y2="0.55"><stop offset="0" stop-color="#3fb950" stop-opacity="0.9"/><stop offset="0.45" stop-color="#58a6ff" stop-opacity="0.55"/><stop offset="0.8" stop-color="#d0d7de" stop-opacity="1"/></linearGradient>
