<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1184" viewBox="0 0 900 1184">
<defs>
<linearGradient id="shellEdge-0ca7da94" x1="0" y1="0" x2="1" y2="0.9">
<stop offset="0" stop-color="#9a6700" stop-opacity="0.85"/>
<stop offset="0.3" stop-color="#9a6700" stop-opacity="0.12"/>
<stop offset="0.65" stop-color="#d0d7de" stop-opacity="1"/>
</linearGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="1183" rx="12" fill="#ffffff" stroke="url(#shellEdge-0ca7da94)"/>
<text x="24" y="30" font-size="18" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Glossary</text>
<text x="24" y="48" font-size="12" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the homegrown stats on this page, and how they're computed</text>
<g transform="translate(0,56)"><text x="24" y="19.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wRP</text><text x="120" y="19.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">weighted Reps Practiced</text>
<text x="120" y="37.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Σ commits √min(400, lines credited to the skill) · 4-week weights 1 / .6 / .36 / .22</text>
<text x="120" y="55.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Reads each week's actual diffs, not commit messages, across every repo I own: my commits, the dev agents' (Claude,</text>
<text x="120" y="71.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Cursor, Copilot) and code-fixing CI bots'; pure automations — snapshot pushes, dependency bots — don't count. A file that</text>
<text x="120" y="87.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">is the skill (Dockerfile, workflow YAML, test file) credits all its changed lines; a changed line that uses it (import</text>
<text x="120" y="103.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">torch, async def, CREATE TABLE) credits 4 lines of context. Deletions count half; lockfiles, vendored and generated files</text>
<text x="120" y="119.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">are ignored. Bubbles show the percentile of that 4-week wRP among every skill's 4-week wRP over the last 26 weeks.</text>
<line x1="24" y1="134.0" x2="876" y2="134.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="155.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">gWAR</text><text x="120" y="155.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Git Wins Above Replacement</text>
<text x="120" y="173.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ln(1+commits 90d) + 1.25·ln(1+stars) + 0.75·ln(1+forks) + freshness − replacement</text>
<text x="120" y="191.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Runs created by a repo: recent activity and adoption, log-damped so one viral repo or one sprint can't own the scale,</text>
<text x="120" y="207.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">plus up to 1 for a push in the last 90 days. Replacement level is the 20th-percentile repo in my public index, so a</text>
<text x="120" y="223.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">forgettable repo sits near 0 and can dip negative. Not Baseball-Reference's bWAR.</text>
<line x1="24" y1="238.0" x2="876" y2="238.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="259.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Lang+</text><text x="120" y="259.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">language usage, 100-neutral split</text>
<text x="120" y="277.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 + (100 × (30d share ÷ 12m share) − 100) × volume-weight</text>
<text x="120" y="295.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Like OPS+: 100 is my normal usage of a language, 130 means 30% more of my commits touched it this month than over the</text>
<text x="120" y="311.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">year. Empirical Bayes shrinkage regresses small samples toward 100 based on commit volume (prior = 25 commits), displayed</text>
<text x="120" y="327.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">in both Top Languages and the 30-day Language Activity lanes.</text>
<line x1="24" y1="342.0" x2="876" y2="342.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="363.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wDC</text><text x="120" y="363.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">weighted Deployments Created</text>
<text x="120" y="381.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Σ weeks-of-last-4 (deployments that week) · weights 1 / .6 / .36 / .22</text>
<text x="120" y="399.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Every deployment I created in the last four weeks: Cloudflare Pages deploys plus Workers last-deployed timestamps.</text>
<text x="120" y="415.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Recency-weighted, so shipping this week counts about five times as much as shipping four weeks ago. On the Season Stat</text>
<text x="120" y="431.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Line card.</text>
<line x1="24" y1="446.0" x2="876" y2="446.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="467.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">aERA</text><text x="120" y="467.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">adjusted Actions ERA</text>
<text x="120" y="485.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">9 × (failed runs, regressed) ÷ total runs · lower is better</text>
<text x="120" y="503.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Borrowed from pitching: earned runs per 9 innings, here failed GitHub Actions runs per 9 runs across my public repos over</text>
<text x="120" y="519.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the last 28 days. League average is 4.50; green means pipelines mostly stay up. The lowercase-a prefix keeps it clear of</text>
<text x="120" y="535.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">pitching ERA on the MLB Birthday Index card.</text>
<line x1="24" y1="550.0" x2="876" y2="550.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="571.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Pace+</text><text x="120" y="571.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">commit pace, 100-neutral split</text>
<text x="120" y="589.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 × (recent daily rate, regressed) ÷ baseline daily rate</text>
<text x="120" y="607.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Recent pace against the usual pace, regressed with 7 days at the baseline rate. Activity compares the last 30 days of</text>
<text x="120" y="623.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">contributions vs the year; Project Pulse and the Immaculate Grid compare 30d vs 90d commit rate.</text>
<line x1="24" y1="638.0" x2="876" y2="638.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="659.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">FIX−</text><text x="120" y="659.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">corrective load, 100-neutral</text>
<text x="120" y="677.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 × 28-day fix share (regressed) ÷ season fix share</text>
<text x="120" y="695.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Share of commits fixing rather than building: subjects matching fix, hotfix, revert, or bugfix across every owned repo</text>
<text x="120" y="711.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">and branch. 100 is my usual load; 70 means a third fewer fixes than usual.</text>
<line x1="24" y1="726.0" x2="876" y2="726.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="747.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">SHIP+</text><text x="120" y="747.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">share of active repos shipping</text>
<text x="120" y="765.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">repos with a release in 90 days ÷ active repos</text>
<text x="120" y="783.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">What share of repos I actually touched shipped a release this quarter. Higher is better.</text>
<line x1="24" y1="798.0" x2="876" y2="798.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="819.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">dOUT−</text><text x="120" y="819.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">sidelined repos</text>
<text x="120" y="837.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">repos whose latest default-branch check failed</text>
<text x="120" y="855.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">The injured list: a plain count, lower is better. On the Season Stat Line card.</text>
<line x1="24" y1="870.0" x2="876" y2="870.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="891.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wMRG+</text><text x="120" y="891.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">recency-weighted merge rate</text>
<text x="120" y="909.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">merged ÷ decided PRs, weeks weighted 1/.6/.36/.22</text>
<text x="120" y="927.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Share of closed pull requests that merged over 90 days, this week's outcomes counting most.</text>
<line x1="24" y1="942.0" x2="876" y2="942.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="963.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">+/−</text><text x="120" y="963.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">polarity suffixes</text>
<text x="120" y="981.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 = my normal baseline</text>
<text x="120" y="999.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">A trailing + means higher is more-or-better (Lang+, Pace+, SHIP+); a trailing − means lower is better (FIX−, dOUT−). On a</text>
<text x="120" y="1015.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">100-neutral split, 100 is always my normal rate and distance from 100 is the story.</text>
<line x1="24" y1="1030.0" x2="876" y2="1030.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="1051.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a w g d</text><text x="120" y="1051.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">method and scope prefixes</text>
<text x="120" y="1069.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">a regressed · w recency-weighted · g/d scoped</text>
<text x="120" y="1087.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a (adjusted): small samples are regressed toward the baseline with phantom league-average events. w (weighted): weekly</text>
<text x="120" y="1103.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">values decay 1, .6, .36, .22 newest-first. g/d scope the count: git-native totals or the default branch.</text></g>
</svg>