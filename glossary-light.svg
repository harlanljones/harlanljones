<svg xmlns="http://www.w3.org/2000/svg" width="900" height="752" viewBox="0 0 900 752">
<defs>
<linearGradient id="shellEdge" x1="0" y1="0" x2="1" y2="0.9">
<stop offset="0" stop-color="#9a6700" stop-opacity="0.85"/>
<stop offset="0.3" stop-color="#9a6700" stop-opacity="0.12"/>
<stop offset="0.65" stop-color="#d0d7de" stop-opacity="1"/>
</linearGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="751" rx="12" fill="#ffffff" stroke="url(#shellEdge)"/>
<text x="24" y="30" font-size="18" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Glossary</text>
<text x="24" y="48" font-size="12.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the homegrown stats on this page, and how they're computed</text>
<g transform="translate(0,56)"><text x="24" y="19.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wRP</text><text x="120" y="19.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">weighted Reps Practiced</text>
<text x="120" y="37.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Σ commits √min(400, lines credited to the skill) · 4-week weights 1 / .6 / .36 / .22</text>
<text x="120" y="55.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Reads each week's actual diffs, not commit messages, across every repo I own: my commits, the dev agents' (Claude,</text>
<text x="120" y="71.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Cursor, Copilot) and code-fixing CI bots'; pure automations — snapshot pushes, dependency bots — don't count. A file that</text>
<text x="120" y="87.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">is the skill (Dockerfile, workflow YAML, test file) credits all its changed lines; a changed line that uses it (import</text>
<text x="120" y="103.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">torch, async def, CREATE TABLE) credits 4 lines of context. Deletions count half; lockfiles, vendored and generated files</text>
<text x="120" y="119.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">are ignored. The square root rewards steady, focused reps over one giant dump. Bubbles show the percentile of that 4-week</text>
<text x="120" y="135.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wRP among every skill's 4-week wRP over the last 26 weeks, a league made of my own skill-weeks: 50 is a median</text>
<text x="120" y="151.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">skill-week, 99 is among my most-practiced.</text>
<line x1="24" y1="166.0" x2="876" y2="166.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="187.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">gWAR</text><text x="120" y="187.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Git Wins Above Replacement</text>
<text x="120" y="205.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ln(1+commits 90d) + 1.25·ln(1+stars) + 0.75·ln(1+forks) + freshness − replacement</text>
<text x="120" y="223.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Runs created by a repo: recent activity and adoption, log-damped so one viral repo or one sprint can't own the scale,</text>
<text x="120" y="239.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">plus up to 1 for a push in the last 90 days. Replacement level is the 20th-percentile repo in my public index, so a</text>
<text x="120" y="255.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">forgettable repo sits near 0 and can dip negative. Not Baseball-Reference's bWAR.</text>
<line x1="24" y1="270.0" x2="876" y2="270.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="291.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Lang+</text><text x="120" y="291.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">language usage, 100-neutral split</text>
<text x="120" y="309.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 × (30-day share, regressed) ÷ 12-month share</text>
<text x="120" y="327.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Like OPS+: 100 is my normal usage of a language, 130 means 30% more of my commits touched it this month than over the</text>
<text x="120" y="343.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">year. Languages come from the extensions of the files each commit changed, across every repo and branch, so a commit</text>
<text x="120" y="359.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">counts once for each language it touched. The 30-day share is regressed toward the season share with 25 phantom commits,</text>
<text x="120" y="375.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">so a language needs real volume before it moves far from 100.</text>
<line x1="24" y1="390.0" x2="876" y2="390.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="411.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">wDC</text><text x="120" y="411.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">weighted Deployments Created</text>
<text x="120" y="429.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Σ weeks-of-last-4 (deployments that week) · weights 1 / .6 / .36 / .22</text>
<text x="120" y="447.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Every deployment I created in the last four weeks: Cloudflare Pages deploys plus Workers last-deployed timestamps.</text>
<text x="120" y="463.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Recency-weighted, so shipping this week counts about five times as much as shipping four weeks ago. Lives on the How This</text>
<text x="120" y="479.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Page Is Built card.</text>
<line x1="24" y1="494.0" x2="876" y2="494.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="515.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">ERA</text><text x="120" y="515.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Actions Env Reliability Average</text>
<text x="120" y="533.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">9 × (failed runs, regressed) ÷ total runs · lower is better</text>
<text x="120" y="551.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Borrowed from pitching: earned runs per 9 innings, here failed GitHub Actions runs per 9 runs across my public repos over</text>
<text x="120" y="567.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the last 28 days. League average is about 4.50; green means the pipelines mostly stay up. Small samples are regressed</text>
<text x="120" y="583.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">toward 4.50.</text>
<line x1="24" y1="598.0" x2="876" y2="598.0" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="619.0" font-size="15" font-weight="800" fill="#9a6700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Pace+</text><text x="120" y="619.0" font-size="12.5" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">commit pace, 100-neutral split</text>
<text x="120" y="637.0" font-size="11" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">100 × (recent daily rate, regressed) ÷ baseline daily rate</text>
<text x="120" y="655.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Recent pace against the usual pace, regressed with 7 days at the baseline rate. Activity: the last 30 days of</text>
<text x="120" y="671.0" font-size="11.5" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">contributions vs the year. Repo cards and the Immaculate Grid: a repo's last 30 days of commits vs its own 90-day rate.</text></g>
</svg>